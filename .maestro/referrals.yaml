# Phase 10.5 — Referral flow on mobile (Maestro)
#
# The half of the story the app does not own — a referred order being paid, the
# referrer's points landing exactly once, a cancelled order paying nobody, a
# redelivered webhook paying nothing more — needs a real payment, an admin and a
# webhook, none of which are reachable from a phone. `scripts/seed-referral.mjs`
# drives and asserts all of it over the API, and leaves behind the two accounts
# this flow signs in as: a referrer with a code and 3 invited / 1 rewarded, and a
# referee attributed to that code who has not ordered yet.
#
# What is left here is what the app itself owns: signing up on a referral link,
# the discount that link buys the referee at checkout, the referrer's card, and
# the referrer being refused their own code.
#
# Prerequisites:
#   - backend up at 127.0.0.1:8787 (ENVIRONMENT=development), reachable from the
#     emulator — the app reads EXPO_PUBLIC_API_BASE_URL, which on an Android
#     emulator must be http://10.0.2.2:8787, not localhost;
#   - the app installed on a simulator/emulator. The appId below is the Expo Go
#     container; for a standalone/dev build, replace it with this app's real
#     bundle id.
#
# Run:
#   node .maestro/scripts/seed-referral.mjs      # prints the command below
#   maestro test -e REFERRAL_CODE=... -e REFERRAL_LINK=... -e REFERRER_EMAIL=... \
#     -e REFEREE_EMAIL=... -e REFERRAL_SIGNUP_EMAIL=... -e REFERRAL_PASSWORD=... \
#     -e REFERRAL_PRODUCT="Referral Test Item" .maestro/referrals.yaml
#   node .maestro/scripts/seed-referral.mjs --reset
#
# **Re-seed before every run.** Part 1 signs a fourth shopper up against the
# code, so the counts part 3 asserts are only right on a fresh seed.
#
# Razorpay is deliberately never opened: the flow stops at the pay button and
# asserts the amount it offers to charge. Paying for real needs test keys and
# native Razorpay setup, both still deferred (see 3.4).
appId: host.exp.Exponent
---
# ---------------------------------------------------------------------------
# Part 1 — a referred friend signs up on the link they were sent.
# ---------------------------------------------------------------------------
- launchApp:
    clearState: true

- tapOn: "Account"
- tapOn: "Log In"
- tapOn: "Create an Account"
- assertVisible:
    id: "referral-code-input"

# A link with no code in it is refused here, by name, rather than sent to the
# server as if it were a code — the signup would otherwise succeed and quietly
# lose the attribution the shopper was sent a link for.
- tapOn:
    id: "signup-email"
- inputText: ${REFERRAL_SIGNUP_EMAIL}
- tapOn:
    id: "signup-password"
- inputText: ${REFERRAL_PASSWORD}
- tapOn:
    id: "referral-code-input"
- inputText: "https://shop.example.com/welcome"
- tapOn:
    id: "signup-submit"
- assertVisible:
    id: "referral-code-error"
- assertNotVisible:
    id: "signup-verify-notice"

# The real link — pasted whole, with the code in lower case, which is how it
# arrives from a share sheet — is read, normalised and accepted.
- tapOn:
    id: "referral-code-input"
- eraseText
- inputText: ${REFERRAL_LINK}
- tapOn:
    id: "signup-submit"
- assertVisible:
    id: "signup-verify-notice"

# ---------------------------------------------------------------------------
# Part 2 — the referee's half of the reward: the discount on their order.
# The seeded referee is already verified, which the freshly signed-up one above
# cannot be from inside the app (the verification link goes to a mailbox).
# ---------------------------------------------------------------------------
- tapOn: "Go to Login"
- tapOn:
    id: "login-email"
- inputText: ${REFEREE_EMAIL}
- tapOn:
    id: "login-password"
- inputText: ${REFERRAL_PASSWORD}
- tapOn:
    id: "login-submit"
- assertVisible:
    id: "product-list"

- scrollUntilVisible:
    element:
      text: ${REFERRAL_PRODUCT}
    direction: DOWN
- tapOn: ${REFERRAL_PRODUCT}
- assertVisible:
    id: "product-detail"
- tapOn:
    id: "add-to-cart-button"

- tapOn: "Cart"
- assertVisible:
    id: "cart-item"
- tapOn:
    id: "checkout-button"

- tapOn:
    id: "contact-email"
- inputText: ${REFEREE_EMAIL}
- tapOn:
    id: "contact-next"

- tapOn:
    id: "address-fullName"
- inputText: "Asha Rao"
- tapOn:
    id: "address-phone"
- inputText: "+919876543210"
- tapOn:
    id: "address-line1"
- inputText: "1 MG Road"
- tapOn:
    id: "address-city"
- inputText: "Bengaluru"
- tapOn:
    id: "address-state"
- inputText: "KA"
- tapOn:
    id: "address-postalCode"
- inputText: "560001"
- tapOn:
    id: "address-next"

- assertVisible:
    id: "checkout-total"
    text: "₹1,000.00"
- assertNotVisible:
    id: "checkout-discount"

# The referral code is a coupon row, so it applies through the same field any
# other code does — 10% of ₹1,000.
- tapOn:
    id: "coupon-code"
- inputText: ${REFERRAL_CODE}
- tapOn:
    id: "coupon-apply"
- assertVisible:
    id: "coupon-discount"
    text: "−₹100.00"
- assertVisible:
    id: "checkout-discount"
    text: "−₹100.00"
- assertVisible:
    id: "checkout-total"
    text: "₹900.00"
# The button's label is a child of the pressable that carries the id, so the
# amount it offers to charge is asserted as its own text.
- assertVisible:
    id: "pay-button"
- assertVisible: "Pay ₹900.00"

# ---------------------------------------------------------------------------
# Part 3 — the referrer's card, and the fraud gate on their own code.
# A fresh launch rather than a log-out: the checkout screen is pushed over the
# tabs, and the session this part needs is a different shopper's anyway.
# ---------------------------------------------------------------------------
- launchApp:
    clearState: true

- tapOn: "Account"
- tapOn: "Log In"
- tapOn:
    id: "login-email"
- inputText: ${REFERRER_EMAIL}
- tapOn:
    id: "login-password"
- inputText: ${REFERRAL_PASSWORD}
- tapOn:
    id: "login-submit"
- assertVisible:
    id: "product-list"

- tapOn: "Account"
- assertVisible:
    id: "referral-card"
- assertVisible:
    id: "referral-code"
    text: ${REFERRAL_CODE}
# What the referrer is owed, stated on the card: a link nobody knows the value
# of is not worth sharing.
- assertVisible:
    id: "referral-reward"
    text: ".*100 points.*"
# Three signed up against this code (two seeded, one from part 1), one of them
# rewarded — the only place the app shows that a reward actually fired, since
# this store runs with loyalty switched off and the balance is hidden with it.
- assertVisible:
    id: "referral-invited"
    text: "3"
- assertVisible:
    id: "referral-rewarded"
    text: "1"
# Tapped, this opens the OS share sheet, which is the OS's to test, not ours.
- assertVisible:
    id: "referral-share"

# The referrer cannot spend their own code. Without this, generating a link and
# using it yourself is a standing discount on every order you place.
- tapOn: "Home"
- scrollUntilVisible:
    element:
      text: ${REFERRAL_PRODUCT}
    direction: DOWN
- tapOn: ${REFERRAL_PRODUCT}
- assertVisible:
    id: "product-detail"
- tapOn:
    id: "add-to-cart-button"

- tapOn: "Cart"
- assertVisible:
    id: "cart-item"
- tapOn:
    id: "checkout-button"

- tapOn:
    id: "contact-email"
- inputText: ${REFERRER_EMAIL}
- tapOn:
    id: "contact-next"

- tapOn:
    id: "address-fullName"
- inputText: "Asha Rao"
- tapOn:
    id: "address-phone"
- inputText: "+919876543210"
- tapOn:
    id: "address-line1"
- inputText: "1 MG Road"
- tapOn:
    id: "address-city"
- inputText: "Bengaluru"
- tapOn:
    id: "address-state"
- inputText: "KA"
- tapOn:
    id: "address-postalCode"
- inputText: "560001"
- tapOn:
    id: "address-next"

- tapOn:
    id: "coupon-code"
- inputText: ${REFERRAL_CODE}
- tapOn:
    id: "coupon-apply"
- assertVisible:
    id: "coupon-error"
    text: "You cannot use your own referral code"
- assertNotVisible:
    id: "checkout-discount"
- assertVisible:
    id: "checkout-total"
    text: "₹1,000.00"
