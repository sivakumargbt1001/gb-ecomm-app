name: CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --install-links --legacy-peer-deps
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  # EAS preview build trigger deferred: no Expo/EAS account or eas.json exists yet
  # (see plans/phase-00-foundation.md sub-phase 0.6). Add an `eas-preview` job here,
  # gated on `github.event_name == 'pull_request'`, once EAS is set up.
